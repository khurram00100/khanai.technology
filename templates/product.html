<section class="product-hero container">
  <span class="status status-$status">$status_label</span>
  <h1>$name</h1>
  <p class="lead">$tagline</p>
  <p class="offer">$description</p>
  <div class="cta-row">
$cta_buttons
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-head"><span class="eyebrow">Features</span><h2>What $name offers</h2></div>
    <div class="grid feature-grid">
$feature_cards
    </div>
  </div>
</section>
$screenshots_section
$pricing_section
<section class="section">
  <div class="narrow">
    <span class="eyebrow">Product policies</span>
    <h2>Read before using or purchasing</h2>
    <div class="legal-links">
      <a href="$slug-privacy.html">Privacy Policy</a>
      <a href="$slug-terms.html">Terms &amp; Conditions</a>
      <a href="$slug-refund.html">Refund Policy</a>
    </div>
  </div>
</section>
